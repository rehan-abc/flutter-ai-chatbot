name: Daily Update

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Perform Daily Update Across Random Folders
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          
          if [ ! -f "DAILY_UPDATES.md" ]; then
            echo "# Daily Project Updates" > DAILY_UPDATES.md
            echo "" >> DAILY_UPDATES.md
          fi
          
          ENTRIES=$(grep -c "^- " DAILY_UPDATES.md || true)
          DAY=$((ENTRIES + 1))
          
          if [ $DAY -gt 14 ]; then
            echo "Completed 14 daily updates (2 weeks). No further commits needed."
            exit 0
          fi

          git config user.name "rehan-abc"
          git config user.email "312452399+rehan-abc@users.noreply.github.com"
          
          case $DAY in
            1)
              mkdir -p docs
              cat << 'EOF' > docs/API_GUIDE.md
# API Integration Guide

This guide describes how the Flutter AI Chatbot communicates with supported providers:
- **Google Gemini**: Uses REST `v1beta/models/{model}:generateContent` endpoint.
- **OpenAI / Groq / OpenRouter**: Uses standard OpenAI-compatible `/chat/completions` endpoint.
EOF
              echo "- Day 1 ($CURRENT_DATE): Added API guide in docs folder" >> DAILY_UPDATES.md
              git add docs/API_GUIDE.md DAILY_UPDATES.md
              COMMIT_MSG="Add API integration guide in docs"
              ;;
            2)
              echo "" >> lib/constants/api_constants.dart
              echo "/// Request timeout duration configuration (updated $CURRENT_DATE)" >> lib/constants/api_constants.dart
              echo "const Duration apiTimeout = Duration(seconds: 30);" >> lib/constants/api_constants.dart
              echo "- Day 2 ($CURRENT_DATE): Added timeout constants in lib/constants" >> DAILY_UPDATES.md
              git add lib/constants/api_constants.dart DAILY_UPDATES.md
              COMMIT_MSG="Add request timeout configuration in constants"
              ;;
            3)
              cat << 'EOF' > test/chat_model_test.dart
import 'package:flutter_test/flutter_test.dart';
import 'package:flutter_simple_chatbot/models/chat_message.dart';

void main() {
  test('ChatMessage model creates user message correctly', () {
    final msg = ChatMessage(
      id: '1',
      text: 'Hello test',
      isUser: true,
      timestamp: DateTime.now(),
    );
    expect(msg.text, 'Hello test');
    expect(msg.isUser, true);
  });
}
EOF
              echo "- Day 3 ($CURRENT_DATE): Added model unit tests in test folder" >> DAILY_UPDATES.md
              git add test/chat_model_test.dart DAILY_UPDATES.md
              COMMIT_MSG="Add unit tests for ChatMessage in test folder"
              ;;
            4)
              echo "" >> lib/models/chat_message.dart
              echo "/// Extension providing helper methods for ChatMessage (verified $CURRENT_DATE)" >> lib/models/chat_message.dart
              echo "- Day 4 ($CURRENT_DATE): Updated ChatMessage helper methods in lib/models" >> DAILY_UPDATES.md
              git add lib/models/chat_message.dart DAILY_UPDATES.md
              COMMIT_MSG="Update ChatMessage model helpers in models"
              ;;
            5)
              echo "" >> lib/services/chat_service.dart
              echo "/// Network retry and error resilience note (updated $CURRENT_DATE)" >> lib/services/chat_service.dart
              echo "- Day 5 ($CURRENT_DATE): Improved error handling comments in lib/services" >> DAILY_UPDATES.md
              git add lib/services/chat_service.dart DAILY_UPDATES.md
              COMMIT_MSG="Improve error resilience notes in services"
              ;;
            6)
              echo "" >> lib/screens/widgets/chat_bubble.dart
              echo "/// ChatBubble rendering and accessibility configuration (verified $CURRENT_DATE)" >> lib/screens/widgets/chat_bubble.dart
              echo "- Day 6 ($CURRENT_DATE): Updated accessibility comments in lib/screens/widgets" >> DAILY_UPDATES.md
              git add lib/screens/widgets/chat_bubble.dart DAILY_UPDATES.md
              COMMIT_MSG="Update chat bubble styling notes in widgets"
              ;;
            7)
              sed -i "s/Flutter Chatbot/Flutter AI Chatbot - Multi-Provider/g" web/index.html
              echo "- Day 7 ($CURRENT_DATE): Updated web title and metadata in web folder" >> DAILY_UPDATES.md
              git add web/index.html DAILY_UPDATES.md
              COMMIT_MSG="Update web application title in web folder"
              ;;
            8)
              echo "" >> lib/constants/app_colors.dart
              echo "/// Dark mode theme color constants (planned update $CURRENT_DATE)" >> lib/constants/app_colors.dart
              echo "- Day 8 ($CURRENT_DATE): Added dark mode palette notes in lib/constants" >> DAILY_UPDATES.md
              git add lib/constants/app_colors.dart DAILY_UPDATES.md
              COMMIT_MSG="Add dark theme palette notes in constants"
              ;;
            9)
              cat << 'EOF' > test/ai_provider_test.dart
import 'package:flutter_test/flutter_test.dart';
import 'package:flutter_simple_chatbot/models/ai_provider.dart';

void main() {
  test('AiProvider enum contains expected providers', () {
    expect(AiProvider.values.length, 4);
    expect(AiProvider.gemini.displayName, 'Google Gemini');
  });
}
EOF
              echo "- Day 9 ($CURRENT_DATE): Added provider unit test in test folder" >> DAILY_UPDATES.md
              git add test/ai_provider_test.dart DAILY_UPDATES.md
              COMMIT_MSG="Add AiProvider unit test in test folder"
              ;;
            10)
              echo "" >> lib/screens/chat_screen.dart
              echo "/// Auto-scroll controller behavior documentation (verified $CURRENT_DATE)" >> lib/screens/chat_screen.dart
              echo "- Day 10 ($CURRENT_DATE): Documented scroll controller in lib/screens" >> DAILY_UPDATES.md
              git add lib/screens/chat_screen.dart DAILY_UPDATES.md
              COMMIT_MSG="Update scroll controller notes in screens"
              ;;
            11)
              mkdir -p docs
              cat << 'EOF' > docs/TROUBLESHOOTING.md
# Troubleshooting Guide

Common setup issues and their resolutions:
1. **Missing API Key**: Ensure you add keys either in `.env` or in Settings.
2. **HTTP 429**: Rate limits reached. Wait 60 seconds before sending prompts.
EOF
              echo "- Day 11 ($CURRENT_DATE): Added troubleshooting guide in docs folder" >> DAILY_UPDATES.md
              git add docs/TROUBLESHOOTING.md DAILY_UPDATES.md
              COMMIT_MSG="Add troubleshooting guide in docs"
              ;;
            12)
              echo "" >> lib/services/storage_service.dart
              echo "/// Key storage security and caching notes (verified $CURRENT_DATE)" >> lib/services/storage_service.dart
              echo "- Day 12 ($CURRENT_DATE): Updated storage persistence notes in lib/services" >> DAILY_UPDATES.md
              git add lib/services/storage_service.dart DAILY_UPDATES.md
              COMMIT_MSG="Update persistence documentation in services"
              ;;
            13)
              echo "" >> lib/screens/widgets/settings_dialog.dart
              echo "/// Provider switching dialog validator notes (verified $CURRENT_DATE)" >> lib/screens/widgets/settings_dialog.dart
              echo "- Day 13 ($CURRENT_DATE): Refined settings validation in lib/screens/widgets" >> DAILY_UPDATES.md
              git add lib/screens/widgets/settings_dialog.dart DAILY_UPDATES.md
              COMMIT_MSG="Improve settings dialog validation in widgets"
              ;;
            14)
              echo "" >> README.md
              echo "<!-- 2-week maintenance verified: $CURRENT_DATE -->" >> README.md
              echo "- Day 14 ($CURRENT_DATE): Completed 2-week maintenance cycle" >> DAILY_UPDATES.md
              git add README.md DAILY_UPDATES.md
              COMMIT_MSG="Complete two-week maintenance cycle in documentation"
              ;;
          esac
          
          git commit -m "$COMMIT_MSG"
          git push
          echo "Successfully pushed Day $DAY commit: $COMMIT_MSG"
